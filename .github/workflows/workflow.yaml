name: Build, Push & Update GitOps

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: rhapsody008/hello-app
  GITOPS_REPO: rhapsody008/mtx-demo-gitops
  GITOPS_BRANCH: main
  # Path inside the gitops repo containing the kustomization.yaml to update.
  # Change this if your manifests live elsewhere (e.g. "base", "apps/hello-app").
  GITOPS_PATH: .

jobs:
  build-push-update:
    runs-on: arc-runner-set
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Compute image tag
        id: vars
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          ref: ${{ env.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Install kustomize
        run: |
          curl -sLo kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: Update image tag in kustomization
        working-directory: gitops/${{ env.GITOPS_PATH }}
        run: |
          kustomize edit set image ${{ env.IMAGE }}=${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
          echo "----- updated kustomization.yaml -----"
          cat kustomization.yaml

      - name: Commit and push
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git add -A
          git commit -m "chore(hello-app): update image tag to ${{ steps.vars.outputs.tag }}" \
                     -m "Source repo: ${{ github.repository }}" \
                     -m "Source commit: ${{ github.sha }}" \
                     -m "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin ${{ env.GITOPS_BRANCH }}
